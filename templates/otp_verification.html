<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OTP Verification - Social Dashboard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <style>
    body {
      background: linear-gradient(135deg, #74ABE2, #5563DE);
      font-family: 'Arial', sans-serif;
    }
    .otp-container {
      max-width: 400px;
      margin: 50px auto;
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }
    .form-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 30px;
      text-align: center;
      color: #333;
    }
    .form-control {
      border-radius: 8px;
    }
    .btn-primary {
      background-color: #5563DE;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      transition: background-color 0.3s ease;
    }
    .btn-primary:hover {
      background-color: #4351b5;
    }
  </style>
</head>
<body>
  <div class="otp-container animate__animated animate__fadeInUp">
    <h2 class="form-title">OTP Verification</h2>
    <form id="otpForm">
      <div class="mb-3">
        <label for="otp" class="form-label">Enter OTP</label>
        <input type="text" class="form-control" id="otp" placeholder="Enter the OTP sent to your email" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Verify OTP</button>
    </form>
    <div class="mt-3 text-center">
      <p>Didn't receive an OTP? <a href="#" id="resendOtp">Resend OTP</a></p>
    </div>
  </div>
  <script>
    document.getElementById('otpForm').onsubmit = async (e) => {
      e.preventDefault();
      const otp = document.getElementById('otp').value.trim();
      const response = await fetch('/auth/verify-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ otp })
      });
      const result = await response.json();
      alert(result.message || result.error);
      if (response.status === 200) window.location.href = '/login';
    };
    document.getElementById('resendOtp').onclick = async () => {
      const response = await fetch('/auth/resend-otp', { method: 'POST' });
      const result = await response.json();
      alert(result.message || result.error);
    };
  </script>
</body>
</html>
