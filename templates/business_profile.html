{% extends "base.html" %}
{% block title %}Business Profile - Social Dashboard{% endblock %}

{% block content %}
  <div id="headerSection">
    <div class="home-heading">
      <h2>Business Profile</h2>
    </div>
  </div>
  <div id="businessProfileSection">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Google Business Profile</h5>
        <p class="card-text">Manage and view your Google Business Profile data for the last 6 months.</p>
        <button class="btn btn-connect" id="fetchBusinessProfileBtn">Fetch Data</button>
        <div id="businessProfileData" class="mt-3"></div>
      </div>
    </div>
  </div>
{% endblock %}

{% block extra_scripts %}
<script>
  document.getElementById('fetchBusinessProfileBtn').addEventListener('click', async function () {
    const token = localStorage.getItem('jwtToken');
    try {
      // Fetch performance data
      const perfResponse = await fetch('/business-profile/performance', {
        method: 'GET',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const perfData = await perfResponse.json();
      
      // Fetch reviews data
      const reviewsResponse = await fetch('/google-business-profile/reviews', {
        method: 'GET',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const reviewsData = await reviewsResponse.json();
      
      const container = document.getElementById('businessProfileData');
      if (perfResponse.ok && reviewsResponse.ok) {
        let html = '<h4>Performance Data (Last 6 Months)</h4>';
        html += `<pre>${JSON.stringify(perfData, null, 2)}</pre>`;
        html += '<h4>Reviews (Last 6 Months)</h4>';
        html += `<pre>${JSON.stringify(reviewsData, null, 2)}</pre>`;
        container.innerHTML = html;
      } else {
        let errorMsg = '';
        if (!perfResponse.ok) errorMsg += `Performance Error: ${perfData.error}<br>`;
        if (!reviewsResponse.ok) errorMsg += `Reviews Error: ${reviewsData.error}`;
        container.innerHTML = `<p class="text-danger">${errorMsg}</p>`;
      }
    } catch (err) {
      console.error(err);
      document.getElementById('businessProfileData').innerHTML = `<p class="text-danger">An error occurred while fetching data.</p>`;
    }
  });
</script>
{% endblock %}
