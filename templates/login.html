<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Social Dashboard</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- reCAPTCHA -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    :root {
      --primary-color: #7f7fd5;
      --secondary-color: #86a8e7;
      --accent-color: #91eae4;
      --dark-color: #1d1f20;
      --text-color: #ffffff;
      --card-bg: rgba(255, 255, 255, 0.15);
    }
    /* Animated gradient background */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color), var(--accent-color));
      background-size: 400% 400%;
      animation: gradientAnimation 15s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    @keyframes gradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    /* Glassmorphism card */
    .login-container {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .form-title {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 30px;
      text-align: center;
      color: var(--dark-color);
    }
    /* Transparent background for input fields with glass effect removed */
    .form-control {
      border-radius: 10px;
      background: transparent;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: var(--dark-color);
      transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
      padding-right: 2.5rem; /* extra space for the toggle icon */
    }
    .form-control::placeholder {
      color: rgba(0, 0, 0, 0.5);
    }
    .form-control:focus {
      border-color: var(--secondary-color);
      box-shadow: 0 0 10px rgba(134, 168, 231, 0.5);
      background: transparent;
    }
    /* Button with modern hover effect */
    .btn-primary {
      background-color: var(--primary-color);
      border: none;
      border-radius: 10px;
      padding: 12px;
      transition: background-color 0.3s ease, transform 0.2s ease;
      font-size: 1.1rem;
    }
    .btn-primary:hover {
      background-color: #6a6fc0;
      transform: translateY(-3px);
    }
    /* Container for password field (for positioning the eye icon) */
    .password-container {
      position: relative;
    }
    /* Toggle password icon inside the input field */
    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--dark-color);
      z-index: 2;
    }
    /* Make reCAPTCHA container background transparent */
    .g-recaptcha {
      background: transparent !important;
    }
    /* Link styling */
    a {
      text-decoration: none;
      color: var(--primary-color);
      transition: color 0.3s ease;
    }
    a:hover {
      color: #6a6fc0;
    }
    /* Responsive adjustments */
    @media (max-width: 576px) {
      .login-container {
        margin: 20px;
        padding: 30px;
      }
      .form-title {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container animate__animated animate__fadeInUp">
    <h2 class="form-title">Welcome Back</h2>
    <form id="loginForm">
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
      </div>
      <!-- Password input with embedded eye icon -->
      <div class="mb-3 password-container">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
        <span class="password-toggle" id="togglePassword">
          <i class="fas fa-eye"></i>
        </span>
      </div>
      <div class="mb-3 text-center">
        <div class="g-recaptcha" data-sitekey="{{ recaptcha_site_key }}"></div>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <div class="mt-3 text-center">
      <p><a href="/reset-password">Forgot your password?</a></p>
      <p>Don't have an account? <a href="/register">Register here</a></p>
    </div>
  </div>
  
  <script>
    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function () {
      const passwordInput = document.getElementById('password');
      const icon = this.querySelector('i');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    });

    // Login form submission with reCAPTCHA verification
    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const recaptchaResponse = grecaptcha.getResponse();
      if (!recaptchaResponse) {
        alert('Please complete the captcha.');
        return;
      }
      const response = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, recaptcha_response: recaptchaResponse })
      });
      const result = await response.json();
      if (response.status === 200 && result.token) {
        localStorage.setItem('jwtToken', result.token);
        alert('Login successful!');
        window.location.href = '/dashboard';
      } else if (result.requiresOtp) {
        alert(result.message);
        window.location.href = '/otp-verification';
      } else {
        alert(result.error);
        grecaptcha.reset();
      }
    };
  </script>
</body>
</html>
