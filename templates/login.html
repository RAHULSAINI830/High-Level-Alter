<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="form-container">
        <h2>Login</h2>

        <!-- Step 1: Login Form -->
        <div id="login-section">
            <form id="loginForm">
                <label for="email">Email Address:</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter your password" required>

                <button type="submit">Login</button>
            </form>
            <p>Don't have an account? <a href="/register">Register here</a></p>
            <p><a href="#" id="forgotPasswordLink">Forgot Password?</a></p>
        </div>

        <!-- Step 2: Forgot Password Section -->
        <div id="forgot-password-section" style="display: none;">
            <h3>Reset Your Password</h3>
            <form id="forgotPasswordForm">
                <label for="resetEmail">Enter your registered email:</label>
                <input type="email" id="resetEmail" placeholder="Enter your email" required>

                <button type="submit">Send OTP</button>
            </form>
        </div>

        <!-- Step 3: Reset Password via OTP -->
        <div id="reset-password-section" style="display: none;">
            <h3>Enter OTP and New Password</h3>
            <form id="resetPasswordForm">
                <label for="otp">Enter OTP:</label>
                <input type="text" id="otp" placeholder="Enter OTP sent to your email" required>

                <label for="newPassword">New Password:</label>
                <input type="password" id="newPassword" placeholder="Enter new password" required>

                <button type="submit">Reset Password</button>
            </form>
        </div>
    </div>

    <script>
        // Step 1: Handle Login
        // Step 1: Handle Login
        document.getElementById('loginForm').onsubmit = async (event) => {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (response.status === 200) {
                    localStorage.setItem('jwtToken', result.token);  // Saving the token
                    console.log('Stored token:', localStorage.getItem('jwtToken')); // Save token to local storage
                    alert('Login successful!');
                    window.location.href = '/dashboard';  // Redirect to the dashboard
                } else {
                    alert(result.error);
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('An error occurred while logging in.');
            }
        };



        // Step 2: Show "Forgot Password" Section
        document.getElementById('forgotPasswordLink').addEventListener('click', (event) => {
            event.preventDefault();
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('forgot-password-section').style.display = 'block';
        });

        // Step 3: Handle Sending OTP for Password Reset
        document.getElementById('forgotPasswordForm').onsubmit = async (event) => {
            event.preventDefault();

            const email = document.getElementById('resetEmail').value;

            try {
                const response = await fetch('/auth/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email })
                });

                const result = await response.json();
                alert(result.message || result.error);

                if (response.status === 200) {
                    document.getElementById('forgot-password-section').style.display = 'none';
                    document.getElementById('reset-password-section').style.display = 'block';
                }
            } catch (error) {
                console.error('Error sending OTP:', error);
                alert('An error occurred while sending the OTP.');
            }
        };

        // Step 4: Handle Password Reset
        document.getElementById('resetPasswordForm').onsubmit = async (event) => {
            event.preventDefault();

            const email = document.getElementById('resetEmail').value;
            const otp = document.getElementById('otp').value;
            const newPassword = document.getElementById('newPassword').value;

            // Password validation
            const passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
            if (!passwordPattern.test(newPassword)) {
                alert('New password does not meet the requirements.');
                return;
            }

            try {
                const response = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, otp, new_password: newPassword })
                });

                const result = await response.json();
                alert(result.message || result.error);

                if (response.status === 200) {
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('Error resetting password:', error);
                alert('An error occurred while resetting the password.');
            }
        };
    </script>
</body>

</html>
