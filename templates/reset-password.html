<!-- OTP VERIFICATION PAGE -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f3f4f6;
            font-family: 'Arial, sans-serif';
        }
        .container {
            max-width: 400px;
            margin: 60px auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .form-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .btn-primary {
            background-color: #007bff;
            border: none;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="form-title">OTP Verification</h2>
        <form id="otpForm">
            <div class="mb-3">
                <label for="otp" class="form-label">Enter OTP</label>
                <input type="text" class="form-control" id="otp" placeholder="Enter the OTP sent to your email" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Verify OTP</button>
        </form>

        <div class="text-center mt-3">
            <p>Didn't receive an OTP? <a href="#" id="resendOtp">Resend OTP</a></p>
        </div>
    </div>

    <script>
        document.getElementById('otpForm').onsubmit = async (e) => {
            e.preventDefault();
            const otp = document.getElementById('otp').value.trim();
            
            const response = await fetch('/auth/verify-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ otp })
            });

            const result = await response.json();
            alert(result.message || result.error);
            if (response.status === 200) {
                window.location.href = '/dashboard';
            }
        };

        document.getElementById('resendOtp').onclick = async () => {
            const response = await fetch('/auth/resend-otp', { method: 'POST' });
            const result = await response.json();
            alert(result.message || result.error);
        };
    </script>
</body>
</html>
