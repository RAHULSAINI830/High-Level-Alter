<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Social Dashboard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      background-color: #f1f4f8;
      font-family: 'Arial', sans-serif;
    }
    .dashboard-container {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 250px;
      background-color: #343a40;
      color: #fff;
      padding: 20px;
    }
    .sidebar h4 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 1.8rem;
    }
    .sidebar a {
      display: block;
      padding: 10px 15px;
      color: #adb5bd;
      text-decoration: none;
      border-radius: 5px;
      margin-bottom: 10px;
      transition: background-color 0.3s;
    }
    .sidebar a:hover,
    .sidebar a.active {
      background-color: #495057;
      color: #fff;
    }
    .content {
      flex-grow: 1;
      padding: 30px;
      background-color: #fff;
    }
    .card {
      margin-bottom: 20px;
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .card .card-body {
      display: flex;
      align-items: center;
    }
    .card .icon {
      font-size: 2rem;
      margin-right: 20px;
      color: #5563DE;
    }
    .btn-action {
      background-color: #5563DE;
      border: none;
      border-radius: 5px;
      padding: 8px 16px;
      color: #fff;
      transition: background-color 0.3s;
    }
    .btn-action:hover {
      background-color: #4351b5;
    }
    /* Settings button styling */
    #adminSettings {
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <div class="sidebar animate__animated animate__fadeInLeft">
      <h4>Dashboard</h4>
      <a href="#" class="active"><i class="fas fa-home"></i> Home</a>
      <a href="#"><i class="fas fa-chart-line"></i> Analytics</a>
      <a href="#"><i class="fas fa-user"></i> Profile</a>
      <a href="#"><i class="fas fa-cog"></i> Settings</a>
      <button onclick="logout()" class="btn btn-action w-100 mt-4">Logout</button>
      <!-- Settings button visible only for admin -->
      <div id="adminSettings" style="display: none;">
        <button onclick="window.location.href='/settings'" class="btn btn-secondary mt-3">Admin Settings</button>
      </div>
    </div>
    <div class="content animate__animated animate__fadeIn">
      <h2>Welcome, <span id="user-name">User</span>!</h2>
      <p>Your dashboard overview.</p>
      <div class="row">
        <div class="col-md-4">
          <div class="card">
            <div class="card-body">
              <i class="fas fa-chart-bar icon"></i>
              <div>
                <h5>Analytics</h5>
                <p>View detailed analytics.</p>
              </div>
            </div>
          </div>
        </div>
        <!-- Additional cards can be added here -->
      </div>
    </div>
  </div>
  <script>
    async function fetchUserInfo() {
      const token = localStorage.getItem('jwtToken');
      if (!token) {
        alert("You are not logged in. Redirecting to login...");
        window.location.href = '/login';
        return;
      }
      try {
        const response = await fetch('/api/user/profile', {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });
        if (response.ok) {
          const user = await response.json();
          document.getElementById('user-name').innerText = user.name;
          if (user.is_admin) {
            document.getElementById('adminSettings').style.display = 'block';
          }
        } else {
          alert("Failed to fetch user info. Please log in again.");
          window.location.href = '/login';
        }
      } catch (error) {
        console.error('Error fetching user info:', error);
        alert("An error occurred. Redirecting to login.");
        window.location.href = '/login';
      }
    }
    function logout() {
      localStorage.removeItem('jwtToken');
      alert("Logging out...");
      window.location.href = "/login";
    }
    fetchUserInfo();
  </script>
</body>
</html>
