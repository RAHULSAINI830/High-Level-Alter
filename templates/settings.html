<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings - Social Dashboard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2>Settings</h2>
    <hr>
    <!-- Section: Connect Google Analytics -->
    <div class="settings-section mb-4">
      <h4>Connect Your Google Analytics Account</h4>
      <p>
        To see your own analytics data, click the button below to authenticate with your Google account.
        After authentication, please enter your Google Analytics Property ID.
      </p>
      <button class="btn btn-primary" onclick="window.location.href='/auth/google'">
        Connect via Google
      </button>
    </div>
    <!-- Section: Enter GA Property ID -->
    <div class="settings-section">
      <h4>Google Analytics Property ID</h4>
      <div class="mb-3">
        <label for="gaPropertyId" class="form-label">Enter your GA Property ID:</label>
        <input type="text" class="form-control" id="gaPropertyId" placeholder="e.g., 123456789">
      </div>
      <button class="btn btn-success" onclick="saveGAPropertyId()">Save GA Property ID</button>
    </div>
    <div id="settingsMessage" class="mt-3"></div>
  </div>

  <!-- Bootstrap and optional JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    async function saveGAPropertyId() {
      const gaPropertyId = document.getElementById('gaPropertyId').value.trim();
      if (!gaPropertyId) {
        alert('Please enter a valid GA Property ID.');
        return;
      }
      const token = localStorage.getItem('jwtToken');
      try {
        const response = await fetch('/api/user/update-ga-id', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ ga_property_id: gaPropertyId })
        });
        const settingsMessage = document.getElementById('settingsMessage');
        if (response.ok) {
          settingsMessage.innerHTML = `<div class="alert alert-success">Your Google Analytics property has been updated.</div>`;
        } else {
          const errorData = await response.json();
          settingsMessage.innerHTML = `<div class="alert alert-danger">Error: ${errorData.error}</div>`;
        }
      } catch (error) {
        console.error('Error updating GA property:', error);
        alert('An error occurred while saving your GA property.');
      }
    }
  </script>
</body>
</html>
