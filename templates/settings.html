<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings - User Management</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8f9fa; font-family: Arial, sans-serif; }
    .container { margin-top: 30px; }
    h1, h2 { color: #333; }
    table th, table td { vertical-align: middle; }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="mb-4">User Management</h1>

    <!-- Invite New User Card -->
    <div class="card mb-4">
      <div class="card-header">
        <h2>Invite New User</h2>
      </div>
      <div class="card-body">
        <!-- Force the form to not navigate by default -->
        <form id="inviteUserForm" method="post" action="javascript:void(0)">
          <div class="row g-3">
            <div class="col-md-5">
              <label for="inviteEmail" class="form-label">Email</label>
              <input type="email" class="form-control" id="inviteEmail" placeholder="Enter user email" required autocomplete="username">
            </div>
            <div class="col-md-5">
              <label for="invitePassword" class="form-label">Password</label>
              <input type="password" class="form-control" id="invitePassword" placeholder="Enter password" required autocomplete="new-password">
            </div>
            <div class="col-md-2 d-grid">
              <button type="submit" class="btn btn-primary mt-4">Invite</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Existing Users List Card -->
    <div class="card">
      <div class="card-header">
        <h2>Manage Existing Users</h2>
      </div>
      <div class="card-body">
        <div id="usersList">
          {% if created_users and created_users|length > 0 %}
          <div class="table-responsive">
            <table class="table table-striped" id="usersTable">
              <thead>
                <tr>
                  <th>Email</th>
                  <th>Created At</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                {% for user in created_users %}
                <tr data-user-id="{{ user._id }}">
                  <td>{{ user.email }}</td>
                  <td>{{ user.created_at }}</td>
                  <td>
                    <button class="btn btn-sm btn-warning edit-btn" 
                            data-user-id="{{ user._id }}" 
                            data-user-email="{{ user.email }}" 
                            data-user-name="{{ user.name|default('') }}">
                      <i class="fas fa-edit"></i> Edit
                    </button>
                    <button class="btn btn-sm btn-danger delete-btn" data-user-id="{{ user._id }}">
                      <i class="fas fa-trash-alt"></i> Delete
                    </button>
                  </td>
                </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
          {% else %}
          <p class="text-muted">No users have been created yet.</p>
          {% endif %}
        </div>
      </div>
    </div>
  </div>

  <!-- Edit User Modal -->
  <div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editUserModalLabel">Edit User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- Prevent default form submission -->
          <form id="editUserForm" action="javascript:void(0)">
            <input type="hidden" id="editUserId">
            <div class="mb-3">
              <label for="editUserEmail" class="form-label">Email</label>
              <input type="email" class="form-control" id="editUserEmail" required autocomplete="username">
            </div>
            <div class="mb-3">
              <label for="editUserName" class="form-label">Name</label>
              <input type="text" class="form-control" id="editUserName">
            </div>
            <div class="mb-3">
              <label for="editUserIsAdmin" class="form-label">Is Admin?</label>
              <select class="form-select" id="editUserIsAdmin">
                <option value="false">No</option>
                <option value="true">Yes</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      console.log("Settings page script loaded");

      // Invite User Form Submission
      const inviteUserForm = document.getElementById('inviteUserForm');
      if (inviteUserForm) {
        inviteUserForm.addEventListener('submit', async function(e) {
          e.preventDefault();
          const email = document.getElementById('inviteEmail').value;
          const password = document.getElementById('invitePassword').value;
          console.log("Submitting invite for:", email);
          try {
            const response = await fetch('/auth/invite-user', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, password })
            });
            const result = await response.json();
            console.log("Response from invite-user:", result);
            if (response.ok) {
              alert(result.message + "\nPlease check your email for the confirmation link.");
              location.reload();
            } else {
              alert(result.error || "Error inviting user");
            }
          } catch (error) {
            console.error('Error inviting user:', error);
          }
        });
      } else {
        console.error("Invite user form not found.");
      }

      // Delete User Button Clicks
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async function() {
          const userId = this.getAttribute('data-user-id');
          if (confirm("Are you sure you want to delete this user?")) {
            try {
              const response = await fetch(`/api/users/${userId}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' }
              });
              const result = await response.json();
              console.log("Response from delete-user:", result);
              if (response.ok) {
                alert(result.message);
                location.reload();
              } else {
                alert(result.error || "Error deleting user");
              }
            } catch (error) {
              console.error('Error deleting user:', error);
            }
          }
        });
      });

      // Edit User Button Clicks: Open Modal with Data
      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const userId = this.getAttribute('data-user-id');
          const userEmail = this.getAttribute('data-user-email');
          const userName = this.getAttribute('data-user-name');
          document.getElementById('editUserId').value = userId;
          document.getElementById('editUserEmail').value = userEmail;
          document.getElementById('editUserName').value = userName;
          // Set default selection for isAdmin; adjust as needed.
          document.getElementById('editUserIsAdmin').value = "false";
          const editModal = new bootstrap.Modal(document.getElementById('editUserModal'));
          editModal.show();
        });
      });

      // Edit User Form Submission
      const editUserForm = document.getElementById('editUserForm');
      if (editUserForm) {
        editUserForm.addEventListener('submit', async function(e) {
          e.preventDefault();
          const userId = document.getElementById('editUserId').value;
          const email = document.getElementById('editUserEmail').value;
          const name = document.getElementById('editUserName').value;
          const isAdmin = document.getElementById('editUserIsAdmin').value === 'true';
          console.log("Submitting update for user:", userId);
          try {
            const response = await fetch(`/api/users/${userId}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, name, is_admin: isAdmin })
            });
            const result = await response.json();
            console.log("Response from update-user:", result);
            if (response.ok) {
              alert(result.message);
              location.reload();
            } else {
              alert(result.error || "Error updating user");
            }
          } catch (error) {
            console.error('Error updating user:', error);
          }
        });
      } else {
        console.error("Edit user form not found.");
      }
    });
  </script>
</body>
</html>
