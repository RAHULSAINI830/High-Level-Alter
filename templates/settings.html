<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Settings - Social Dashboard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <style>
    body { background-color: #f8f9fa; font-family: 'Arial', sans-serif; }
    .container { max-width: 900px; margin: 50px auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    h2 { text-align: center; margin-bottom: 30px; }
    .btn-primary { background-color: #5563DE; border: none; }
    .table-container { margin-top: 40px; }
  </style>
</head>
<body>
  <div class="container animate__animated animate__fadeInUp">
    <h2>Admin Settings</h2>
    <h4>Invite New User</h4>
    <form id="inviteUserForm">
      <div class="mb-3">
        <label for="inviteEmail" class="form-label">User Email</label>
        <input type="email" class="form-control" id="inviteEmail" placeholder="Enter user email" required>
      </div>
      <div class="mb-3">
        <label for="invitePassword" class="form-label">Temporary Password</label>
        <input type="password" class="form-control" id="invitePassword" placeholder="Enter a temporary password" required>
      </div>
      <button type="submit" class="btn btn-primary">Send Invitation</button>
    </form>

    <div class="table-container">
      <h4 class="mt-5">Users Invited by You</h4>
      <table class="table table-bordered" id="usersTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Admin</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Users will be populated here -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Edit User Modal -->
  <div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="editUserForm">
          <div class="modal-header">
            <h5 class="modal-title" id="editUserModalLabel">Edit User</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editUserId">
            <div class="mb-3">
              <label for="editUserName" class="form-label">Name</label>
              <input type="text" class="form-control" id="editUserName" required>
            </div>
            <div class="mb-3">
              <label for="editUserEmail" class="form-label">Email</label>
              <input type="email" class="form-control" id="editUserEmail" required>
            </div>
            <div class="mb-3">
              <label for="editUserAdmin" class="form-label">Admin</label>
              <select id="editUserAdmin" class="form-select">
                <option value="false">No</option>
                <option value="true">Yes</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Update User</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('inviteUserForm').onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('inviteEmail').value.trim();
      const password = document.getElementById('invitePassword').value.trim();
      const response = await fetch('/auth/invite-user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const result = await response.json();
      alert(result.message || result.error);
      if (response.status === 200) {
        document.getElementById('inviteUserForm').reset();
        loadUsers();
      }
    };

    async function loadUsers() {
      const response = await fetch('/api/users', {
        method: 'GET',
        headers: { 'Content-Type': 'application/json' }
      });
      const users = await response.json();
      const tbody = document.getElementById('usersTable').getElementsByTagName('tbody')[0];
      tbody.innerHTML = "";
      users.forEach(user => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${user.name || ''}</td>
          <td>${user.email}</td>
          <td>${user.is_admin ? 'Yes' : 'No'}</td>
          <td>
            <button class="btn btn-sm btn-warning me-2" onclick="openEditModal('${user._id}', '${user.name}', '${user.email}', ${user.is_admin})">Edit</button>
            <button class="btn btn-sm btn-danger" onclick="deleteUser('${user._id}')">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function openEditModal(id, name, email, isAdmin) {
      document.getElementById('editUserId').value = id;
      document.getElementById('editUserName').value = name;
      document.getElementById('editUserEmail').value = email;
      document.getElementById('editUserAdmin').value = isAdmin ? 'true' : 'false';
      const editUserModal = new bootstrap.Modal(document.getElementById('editUserModal'));
      editUserModal.show();
    }

    document.getElementById('editUserForm').onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('editUserId').value;
      const name = document.getElementById('editUserName').value.trim();
      const email = document.getElementById('editUserEmail').value.trim();
      const isAdmin = document.getElementById('editUserAdmin').value === 'true';
      const response = await fetch(`/api/users/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, is_admin: isAdmin })
      });
      const result = await response.json();
      alert(result.message || result.error);
      if (response.status === 200) {
        const editUserModal = bootstrap.Modal.getInstance(document.getElementById('editUserModal'));
        editUserModal.hide();
        loadUsers();
      }
    };

    async function deleteUser(id) {
      if (!confirm("Are you sure you want to delete this user?")) return;
      const response = await fetch(`/api/users/${id}`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' }
      });
      const result = await response.json();
      alert(result.message || result.error);
      if (response.status === 200) {
        loadUsers();
      }
    }

    loadUsers();
  </script>
</body>
</html>
