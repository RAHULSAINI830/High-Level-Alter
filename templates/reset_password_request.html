<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password - Request OTP</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <style>
    body {
      background: linear-gradient(135deg, #74ABE2, #5563DE);
      font-family: 'Arial', sans-serif;
    }
    .reset-container {
      max-width: 400px;
      margin: 50px auto;
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }
    .form-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 30px;
      text-align: center;
      color: #333;
    }
    .form-control {
      border-radius: 8px;
    }
    .btn-primary {
      background-color: #5563DE;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      transition: background-color 0.3s ease;
    }
    .btn-primary:hover {
      background-color: #4351b5;
    }
  </style>
</head>
<body>
  <div class="reset-container animate__animated animate__fadeInUp">
    <h2 class="form-title">Reset Your Password</h2>
    <form id="resetRequestForm">
      <div class="mb-3">
        <label for="email" class="form-label">Enter your registered email</label>
        <input type="email" class="form-control" id="email" placeholder="Email address" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Send OTP</button>
    </form>
  </div>
  <script>
    document.getElementById('resetRequestForm').onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const response = await fetch('/auth/reset-password-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const result = await response.json();
      alert(result.message || result.error);
      if (response.status === 200) window.location.href = '/reset-password-otp';
    };
  </script>
</body>
</html>
