<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password - Verify OTP & Set New Password</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <style>
    :root {
      --primary-color: #7f7fd5;
      --secondary-color: #86a8e7;
      --accent-color: #91eae4;
      --dark-color: #1d1f20;
      --card-bg: rgba(255, 255, 255, 0.15);
    }
    /* Animated gradient background */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color), var(--accent-color));
      background-size: 400% 400%;
      animation: gradientAnimation 15s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    @keyframes gradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    /* Glassmorphism card */
    .reset-container {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .form-title {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 30px;
      text-align: center;
      color: var(--dark-color);
    }
    .form-control {
      border-radius: 10px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: var(--dark-color);
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .form-control::placeholder {
      color: rgba(0, 0, 0, 0.5);
    }
    .form-control:focus {
      border-color: var(--secondary-color);
      box-shadow: 0 0 10px rgba(134, 168, 231, 0.5);
      background: transparent;
    }
    .btn-primary {
      background-color: var(--primary-color);
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 1.1rem;
      width: 100%;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }
    .btn-primary:hover {
      background-color: #6a6fc0;
      transform: translateY(-3px);
    }
    @media (max-width: 576px) {
      .reset-container {
        margin: 20px;
        padding: 30px;
      }
      .form-title {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="reset-container animate__animated animate__fadeInUp">
    <h2 class="form-title">Verify OTP & Set New Password</h2>
    <form id="resetOtpForm">
      <div class="mb-3">
        <label for="otp" class="form-label">Enter OTP</label>
        <input type="text" class="form-control" id="otp" placeholder="Enter the OTP sent to your email" required>
      </div>
      <div class="mb-3">
        <label for="new_password" class="form-label">New Password</label>
        <input type="password" class="form-control" id="new_password" placeholder="New password" required>
      </div>
      <div class="mb-3">
        <label for="confirm_password" class="form-label">Confirm New Password</label>
        <input type="password" class="form-control" id="confirm_password" placeholder="Confirm password" required>
      </div>
      <button type="submit" class="btn btn-primary">Reset Password</button>
    </form>
  </div>
  <script>
    document.getElementById('resetOtpForm').onsubmit = async (e) => {
      e.preventDefault();
      const otp = document.getElementById('otp').value.trim();
      const new_password = document.getElementById('new_password').value.trim();
      const confirm_password = document.getElementById('confirm_password').value.trim();
      const response = await fetch('/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ otp, new_password, confirm_password })
      });
      const result = await response.json();
      alert(result.message || result.error);
      if (response.status === 200) window.location.href = '/login';
    };
  </script>
</body>
</html>
