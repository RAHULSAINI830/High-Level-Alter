<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - Social Dashboard</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Animate.css for animations -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <style>
    :root {
      --primary-color: #7f7fd5;
      --secondary-color: #86a8e7;
      --accent-color: #91eae4;
      --dark-color: #1d1f20;
      --text-color: #ffffff;
      --card-bg: rgba(255, 255, 255, 0.15);
    }
    /* Animated gradient background */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color), var(--accent-color));
      background-size: 400% 400%;
      animation: gradientAnimation 15s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    @keyframes gradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    /* Glassmorphism card */
    .form-container {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      padding: 40px;
      width: 100%;
      max-width: 500px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .form-title {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 30px;
      text-align: center;
      color: var(--dark-color);
    }
    /* Transparent input fields */
    .form-control {
      border-radius: 10px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: var(--dark-color);
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .form-control::placeholder {
      color: rgba(0, 0, 0, 0.5);
    }
    .form-control:focus {
      border-color: var(--secondary-color);
      box-shadow: 0 0 10px rgba(134, 168, 231, 0.5);
      background: transparent;
    }
    /* Button styling */
    .btn-primary {
      background-color: var(--primary-color);
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 1.1rem;
      width: 100%;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }
    .btn-primary:hover {
      background-color: #6a6fc0;
      transform: translateY(-3px);
    }
    /* Link styling */
    a {
      text-decoration: none;
      color: var(--primary-color);
      transition: color 0.3s ease;
    }
    a:hover {
      color: #6a6fc0;
    }
    @media (max-width: 576px) {
      .form-container {
        margin: 20px;
        padding: 30px;
      }
      .form-title {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="form-container animate__animated animate__fadeInUp">
    <h2 class="form-title">Create Your Account</h2>
    <form id="registerForm">
      <div class="mb-3">
        <label for="name" class="form-label">Full Name:</label>
        <input type="text" class="form-control" id="name" placeholder="Enter your full name" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email Address:</label>
        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password:</label>
        <input type="password" class="form-control" id="password" placeholder="Create a password" required>
        <div class="form-text">At least 8 characters, with uppercase, lowercase, a number, and a special character.</div>
      </div>
      <button type="submit" class="btn btn-primary">Register</button>
    </form>
    <div class="mt-3 text-center">
      <p>Already have an account? <a href="/login">Login here</a></p>
    </div>
  </div>
  <script>
    document.getElementById('registerForm').onsubmit = async (event) => {
      event.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;
      if (!passwordPattern.test(password)) {
        alert('Password does not meet the requirements.');
        return;
      }
      const response = await fetch('/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });
      const result = await response.json();
      alert(result.message || result.error);
      if (response.status === 201) window.location.href = '/otp-verification';
    };
  </script>
</body>
</html>
